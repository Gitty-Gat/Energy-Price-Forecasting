[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-price-forecasting"
version = "0.1.0"
description = "Research-grade energy price forecasting workflows for natural gas and crude oil."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Energy Director Automation" }
]
dependencies = [
  "arch==7.2.0",
  "matplotlib==3.9.2",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "requests==2.32.3",
  "scipy==1.14.1",
  "statsmodels==0.14.4",
]

[project.optional-dependencies]
news = [
  "beautifulsoup4==4.12.3",
  "feedparser==6.0.11",
  "lxml==5.3.0",
  "pyarrow==18.1.0",
  "trafilatura==1.12.2",
]
dev = [
  "pytest==8.3.5",
  "ruff==0.11.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "diagnostics*",
  "features*",
  "ingestion*",
  "models*",
  "pipelines*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
