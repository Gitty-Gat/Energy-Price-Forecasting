[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-price-forecasting"
version = "0.1.0"
description = "Reproducible energy price forecasting pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scipy==1.13.1",
  "statsmodels==0.14.2",
  "arch==7.0.0",
  "matplotlib==3.8.4",
  "scikit-learn==1.5.1",
  "hydra-core==1.3.2",
  "pandera==0.20.3"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
