stages:
  ingest:
    cmd: python src/ingestion/data_ingestion.py --raw-root data/raw --output-path data/processed/ingestion_manifest.json
    deps:
      - data/raw
      - src/ingestion/data_ingestion.py
    outs:
      - data/processed/ingestion_manifest.json

  merge:
    cmd: python src/features/merge_exog_pipeline.py
    deps:
      - data/raw
      - data/processed/ingestion_manifest.json
      - src/features/merge_exog_pipeline.py
    outs:
      - data/processed/merged_exog.csv

  forecast:
    cmd: python src/pipelines/forecast.py --merged data/processed/merged_exog.csv --outputs results/forecasts --horizons 10 20 --seed 42
    deps:
      - data/processed/merged_exog.csv
      - src/pipelines/forecast.py
    outs:
      - results/forecasts

  diagnostics:
    cmd: python src/diagnostics/canonical_diagnostics.py --forecast-dir results/forecasts --output-dir results/diagnostics
    deps:
      - results/forecasts
      - src/diagnostics/canonical_diagnostics.py
    outs:
      - results/diagnostics

  backtest:
    cmd: python src/diagnostics/backtest_runner.py --ng_csv data/raw/prices/NG_prompt_month_futures_price.csv --ol_csv data/raw/prices/Oil_prompt_month_futures_price.csv --out_csv results/backtests/backtest_results.csv --plots_dir results/backtests/plots --model baseline
    deps:
      - data/raw/prices/NG_prompt_month_futures_price.csv
      - data/raw/prices/Oil_prompt_month_futures_price.csv
      - results/forecasts
      - src/diagnostics/backtest_runner.py
    outs:
      - results/backtests
